name: ci
on:
  push:
  pull_request:

jobs:
  secrets:
    # Deuxième barrière, au cas où le crochet local n'est pas installé : tout l'historique est scanné.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --no-banner --redact /repo

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build
      - run: npm test

  web:
    # le site se construit contre le socle compilé : socle d'abord, puis contrôle des types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - run: npm ci && npm run build
        working-directory: server
      - run: npm ci && npm run check && npm run build
        working-directory: web

  deploy:
    # en production SEULEMENT si les trois contrôles sont verts, et seulement depuis main. La clé ne peut lancer
    # que scripts/deploy.sh sur le serveur (command= dans authorized_keys) : construire, vérifier, sinon revenir.
    needs: [secrets, test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - name: déployer
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes ubuntu@146.59.45.179 deploy
