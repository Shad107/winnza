# Winnza sur le serveur.
#   docker compose up -d --build                    le site
#   docker compose run --rm collect                 une collecte (lancée chaque jour par cron)
#
# Le site rejoint le réseau du reverse-proxy existant (Caddy, réseau « coolify ») : pas de port public.
# .env (jamais commité) : WINNZA_ADMIN_TOKEN (coffre « Winnza (www.winnza.eu) »), MATOMO_TOKEN
# (coffre « matomo.winnza.eu », champ token). collect.env (jamais commité, collecte seulement) :
# GOOGLE_ADS_CUSTOMER_ID, GOOGLE_ADS_CLIENT_ID, GOOGLE_ADS_CLIENT_SECRET, GOOGLE_ADS_REFRESH_TOKEN
# (coffre « Google Ads API (Keyword Planner) »).
services:
  web:
    build: .
    image: winnza:latest
    container_name: winnza-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      - ORIGIN=https://www.winnza.eu
      # vraie IP du visiteur derrière Caddy (mesure d'audience) : la dernière entrée de X-Forwarded-For,
      # celle que Caddy ajoute lui-même (les précédentes peuvent venir du visiteur)
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1
      # fond de carte, polices et icônes de la carte des stations (scripts/fetch-map.sh, environ 10 Go)
      - WINNZA_MAP_DIR=/map
    volumes:
      - data:/data
      - /home/ubuntu/winnza-tiles:/map:ro
    networks: [proxy]

  collect:
    image: winnza:latest
    profiles: [collect]
    # identifiants Google Ads du plugin mots-clés (GOOGLE_ADS_*) : un fichier à part, que le site ne lit pas
    env_file: [collect.env]
    command: ["node", "server/dist/cli.js", "collect", "/data/energy.db"]
    volumes:
      - data:/data
    networks: [proxy]

volumes:
  data:
    name: winnza-data

networks:
  proxy:
    name: coolify
    external: true
